# Online Gaussian progress prediction.  The fitted model and query embeddings
# are read-only inputs; all fitting and covariance choices live in the model H5.

gaussian_model_h5_path: /home/user/zhangzk/projects/fineprog/outputs/gaussian_progress_fitting/fruit_expert_sweep/tcc_triplet_w0p5_d32/20260818-225902/gaussian_progress_model-covariance_mode-independent-20260818-225902.h5
nonexpert_h5_path: /home/user/zhangzk/projects/fineprog/datasets/embeddings/COMPOSITE_TCC_TEMPORAL_TRIPLET-fruit_expert_videos-36vid_train-resnet50_conv4c-only_bn-20260815-151030-tcc_triplet_w0p5_d32/fruit_fail_videos-7vid-embd.h5

posterior_temperature: 1.0e4
entropy_epsilon: 1.0e-12

enable_calibration: true # if true, we do the conformal p value calibration
calibration_h5_path: /home/user/zhangzk/projects/fineprog/datasets/embeddings/COMPOSITE_TCC_TEMPORAL_TRIPLET-fruit_expert_videos-36vid_train-resnet50_conv4c-only_bn-20260815-151030-tcc_triplet_w0p5_d32/fruit_expert_videos-20vid_valid-embd.h5
ood_p_value_threshold: 0.05 # OOD if every progress-bin p-value is below this

enable_ood_filter: true
ood_filter_max_gap: 5       # G; required positive integer when enabled
ood_filter_min_ood_run: 20   # L_min; required positive integer when enabled, I used GPT to help me check progress h5data and decide this hyperparameter

save_posterior: true
enable_visualization: true
enable_video: true

# Offline only; consumes diagnostics captured during embedding extraction.
# Existing spatial activation / in-training evaluation settings are independent.
temporal_diagnostics:
  enabled: false
  video_ids: []                 # Nonempty explicit IDs in display order when enabled.
  baseline_prediction_h5: ~     # Baseline's own Gaussian/calibration prediction H5.
  save_png: true
  save_mp4: true
  interval_frames: 16
  num_intervals: 3
  enrichment_vmax: 4.0
  log_to_wandb: false           # New offline eval run; local artifacts are saved first.
  wandb_log_video: false
  wandb_max_videos: 1           # First N selected trajectories: one composite PNG each.

# Optional offline causal replay; this is not a trained structural ablation.
temporal_intervention:
  enabled: false
  attention_mode: ~
  fusion_mode: ~
  mask_mode: none
  query_step: -1
  seed: 42
