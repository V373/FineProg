# Upper single-frame R/M/G semantic classifier. Entrypoint: train_semantic.py
# EfficientNet-B0 (ImageNet) partial fine-tuning + MLP 32D + 3-way head, cross-entropy only.
train_dataset: pick_mango_vid_36vid_train
val_dataset: pick_mango_vid_4vid_valid
# Label v1 (G from gripper release): use *_rmg_labels.csv for both files.
train_labels_csv: datasets/phase_labels/pick_mango_vid-36vid_train_rmg_v2_labels.csv
val_labels_csv: datasets/phase_labels/pick_mango_vid-4vid_valid_rmg_v2_labels.csv
pretrained: true
l2_normalize: true # Design default. false: raw 32D MLP output goes to the head (logit scale unbounded).
output_dir: null # null: outputs/semantic/<timestamp>; an existing directory is never overwritten.
batch_size: 64
num_steps: 300 # Short correctness run; the full-training length is not decided yet.
eval_every: 100
backbone_lr: 1.0e-5 # features[6:]: last two MBConv stages and the final 1x1 conv
head_lr: 1.0e-4 # MLP and classification head
seed: 42
device: cuda
