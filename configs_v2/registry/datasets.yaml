# V2: Dataset Registry
# ═══════════════════════════════════════════════════════════════════════
# Single source of truth for every dataset used in the project.
# Stage configs reference datasets by their key (e.g. robomimic_can_ph_180vid_train).
# The ConfigV2 resolver translates keys into concrete absolute paths at runtime.
#
# Required fields per entry:
#   processed_h5:     Relative path under datasets/processed/
#
# Optional fields:
#   display_name:            Human-readable label
#   raw_dir:                 Subdirectory under datasets/raw/ for the source videos
#   robomimic_hdf5:          Path to the source robomimic HDF5 (relative to project_root)
#   mask_key:                Mask name used when generating this H5 via mp4vid_to_h5data.py
#                              e.g. "20_percent"    → /mask/20_percent_{train,valid}  (--two_split)
#                              e.g. "okay"/"worse"  → /mask/okay  (single split, no two_split)
#                              e.g. "train"/"valid" → /mask/train  (full split)
#   phase_labels_csv:        Path to keyframe annotation CSV (relative to project_root)
#   validation_dataset_ref:  (training datasets only) Registry key of the curated validation
#                              partner. Set only when there is exactly one intended validation
#                              split (e.g. PH train→valid pairs). Leave unset for mixed-quality
#                              datasets (MH) or when multiple valid sizes exist without a
#                              single preferred choice.
# ═══════════════════════════════════════════════════════════════════════

