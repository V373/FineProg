# Resolved path formula:
#   standard → datasets/embeddings/{run_name}/{dataset_h5_stem}-embd.h5
#   mean_path→ datasets/embeddings/{run_name}/{dataset_h5_stem}-embd-mean_path.h5
#   labeled  → datasets/embeddings/{run_name}/{dataset_h5_stem}-embd-labeled.h5
