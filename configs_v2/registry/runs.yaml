# V2: Artifact Registry
# ═══════════════════════════════════════════════════════════════════════
# Manually maintained registry of training runs and embedding artifacts.
# This file is NEVER auto-updated — add entries yourself after each run.
#
# HOW TO ADD A NEW RUN:
#   1. After training completes, copy the run_name from the wandb dashboard
#      or terminal output.
#   2. Add an entry under "runs:" with a short, meaningful alias.
#   3. After extracting embeddings for a dataset, add entries under "embeddings:".
#   4. Reference entries by alias in extract.yaml and eval configs.
#
# WHY NOT AUTO-UPDATE:
#   You often run multiple experiments in parallel and want to control which
#   checkpoint each extraction/evaluation uses.  Explicit entries make this
#   dependency visible and auditable.
#
# SWITCHING CHECKPOINT FOR EVALUATION:
#   Change only the "checkpoint_ref:" line in extract.yaml (or the relevant
#   embedding_ref in the eval config).  No other file needs to change.
# ═══════════════════════════════════════════════════════════════════════


