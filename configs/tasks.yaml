pick_mango:
  data:
    train: datasets/pick_mango/train.h5
    valid: datasets/pick_mango/valid.h5
    calibration: datasets/pick_mango/calibration.h5
    fail: datasets/pick_mango/fail.h5
  labels:
    train: datasets/pick_mango/labels/train.csv
    valid: datasets/pick_mango/labels/valid.csv
    fail: datasets/pick_mango/labels/fail.csv
  weights:
    lower: weights/pick_mango/stage1_local.pt
    upper: weights/pick_mango/stage1_upper.pt
    stage2: weights/pick_mango/stage2_local.pt
  progress:
    stage1:
      temperature: 1000
      ood_threshold: 0.5
    stage2:
      temperature: 70
      ood_threshold: 0.5
  stage2:
    query_split: fail
    train_ids:
    - '000001'
    - '000002'
    - '000003'
    - '000004'
    - '000006'
    - '000007'
    - 000008
    - 000009
    - '000011'
    - '000012'
    - '000014'
    - '000015'
    - '000016'
    - 000018
    valid_ids:
    - '000005'
    - '000010'
    - '000013'
    - '000017'
